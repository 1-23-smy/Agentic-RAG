services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medscan-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT_ALLOW_ANONYMOUS_READ: "true"

  redis:
    image: redis:alpine
    container_name: medscan-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
